---
name: HW Module Profile 8000
path: Cisco-IOS-XR-um-8000-hw-module-profile-cfg:/hw-module
doc_category: Cisco 8000 Series
attributes:
  - yang_name: profile/priority-flow-control/locations/location
    tf_name: profile_priority_flow_control_locations
    type: List
    attributes:
      - yang_name: buffer-extended/non-pfc-tcs
        tf_name: non_pfc_tcs
        type: Bool
        type_yang_bool: presence
        example: true
      - yang_name: buffer-extended/non-pfc-tcs/max-non-pfc-voqs/number-of-evict-voqs
        tf_name: non_pfc_tcs_max_non_pfc_voqs_number_of_evict_voqs
        description: "number of evict voqs"
        type: Int64
        min_int: 1
        max_int: 3800
        example: 100
      - yang_name: buffer-extended/non-pfc-tcs/max-non-pfc-voqs/hbm-buffers-percentage
        tf_name: non_pfc_tcs_max_non_pfc_voqs_hbm_buffers_percentage
        description: "configure hbm-buffers-percentage for non-pfc-tcs"
        type: Int64
        min_int: 50
        max_int: 80
        example: 60
